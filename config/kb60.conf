# Bluetooth and USB, with battery monitoring. Sleeps after 15 idle minutes on
# battery; any key wakes it.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# While Studio is unlocked the keyboard advertises, so the configurator can
# find it over Bluetooth. A paired profile still refuses other devices.
CONFIG_ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK=y

# Status for the configurator, and Bluetooth state on the onboard LED. There
# are no three free pins for the macropad's RGB status LED.
CONFIG_MACROPAD_STATUS_RPC=y
CONFIG_MACROPAD_STATUS_LED=n
CONFIG_MACROPAD_BT_LED=y

# ZMK Studio over USB, so the configurator can remap keys live.
CONFIG_ZMK_STUDIO=y

# Custom Studio RPC (cormoran fork): larger buffers for module payloads.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=192
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=192
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# Macros editable from the configurator (&rmacro <slot>).
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# Live key stream for the configurator's key tester.
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

# Mouse clicks and scrolling (&mkp, &msc). Adds a mouse to the HID descriptor.
CONFIG_ZMK_POINTING=y
