# Bluetooth and USB, with battery monitoring. Sleeps after 15 idle minutes on
# battery; any key wakes it.
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# While Studio is unlocked the keyboard advertises, so the configurator can
# find it over Bluetooth. A paired profile still refuses other devices.
CONFIG_ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK=y

# Status for the configurator, and the macropad's status LED colours on one
# WS2812B (pad 107): green on USB, red on battery (blinking when low), and
# Bluetooth pairing and connection in the profile's colour.
CONFIG_MACROPAD_STATUS_RPC=y
# Off for now: the WS2812B on pad 107 doesn't light (wiring to be checked).
CONFIG_MACROPAD_STATUS_LED=n
CONFIG_MACROPAD_STATUS_LED_BRIGHTNESS=15
CONFIG_SPI=y

# ZMK Studio over USB, so the configurator can remap keys live.
CONFIG_ZMK_STUDIO=y

# Custom Studio RPC (cormoran fork): larger buffers for module payloads.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=192
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=192
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048

# Macros editable from the configurator (&rmacro <slot>).
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# Live key stream for the configurator's key tester.
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

# Mouse clicks and scrolling (&mkp, &msc). Adds a mouse to the HID descriptor.
CONFIG_ZMK_POINTING=y

# VIA (usevia.app) over USB and Bluetooth, from the macropad module. Load
# via/kb60.json in VIA's Design tab. Changes need Studio unlocked (Fn + \).
# A VIA macro of up to about 250 characters fits the behavior queue.
CONFIG_MACROPAD_VIA=y
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Hold Esc while switching on to get the flashing drive.
CONFIG_MACROPAD_BOOT_KEY=y
CONFIG_MACROPAD_BOOT_KEY_ROW=0
CONFIG_MACROPAD_BOOT_KEY_COL=0

# Switching Bluetooth profiles disconnects the other hosts, instead of leaving
# them connected but idle.
CONFIG_MACROPAD_BLE_EXCLUSIVE=y

# Its own USB and Bluetooth ID instead of ZMK's shared 1D50:615E, so VIA and
# the configurator can tell this keyboard from the macropad. 1209:0001 is the
# pid.codes test ID for one-off personal devices; don't ship it on anything
# given away or sold.
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_BT_DIS_PNP_VID=0x1209
CONFIG_BT_DIS_PNP_PID=0x0001
